<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Air Quality Freeboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Noto+Sans+Thai:wght@400;600&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg1:#030914;--bg2:#0b1d3f;--card:rgba(10,24,52,.78);--tx:#dbeafe;--mut:#7f9cc4;--line:rgba(56,189,248,.22);--acc:#38bdf8;--tip:#06122cf2;--glow:0 0 0 1px rgba(56,189,248,.18),0 0 28px rgba(56,189,248,.08);--hd:linear-gradient(90deg,rgba(56,189,248,.28),rgba(56,189,248,0))}
[data-theme="light"]{--bg1:#eef4ff;--bg2:#cfe0ff;--card:rgba(255,255,255,.9);--tx:#0f172a;--mut:#5b6b85;--line:rgba(37,99,235,.25);--acc:#2563eb;--tip:#fffffff2;--glow:0 6px 20px rgba(30,64,175,.12);--hd:linear-gradient(90deg,rgba(37,99,235,.15),rgba(37,99,235,0))}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--tx);padding:14px;
 background:linear-gradient(rgba(56,189,248,.04) 1px,transparent 1px) 0 0/36px 36px,linear-gradient(90deg,rgba(56,189,248,.04) 1px,transparent 1px) 0 0/36px 36px,radial-gradient(ellipse at 50% -10%,var(--bg2),var(--bg1) 65%) fixed;transition:background .4s,color .3s}
.app{max-width:1500px;margin:auto}
.orb{font-family:Orbitron,"Noto Sans Thai",sans-serif}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 16px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--glow)}
.brand{display:flex;align-items:center;gap:10px;font-family:Orbitron,sans-serif;font-weight:800;letter-spacing:.14em;color:var(--acc);text-shadow:0 0 12px var(--acc)}
.brand .ico{width:1.6em;height:1.6em}
.ttl{font-size:1.25rem;font-weight:600;letter-spacing:.06em;text-align:center}
.tr{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-family:Orbitron,sans-serif;font-size:1.05rem;color:var(--acc);text-shadow:0 0 10px var(--acc)}
.st{font-size:.8rem;color:var(--mut)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ef4444;margin-right:6px}
.dot.on{background:#22c55e;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}100%{box-shadow:0 0 0 10px rgba(34,197,94,0)}}
.btn{background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.8rem;transition:.2s}
.btn:hover{border-color:var(--acc);box-shadow:0 0 12px rgba(56,189,248,.35)}
.btn.on{background:var(--acc);border-color:var(--acc);color:#04101f;font-weight:600}
.ico{width:1.1em;height:1.1em;vertical-align:-.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.layout{display:grid;grid-template-columns:300px 1fr 350px;gap:14px;align-items:stretch}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{position:relative;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;box-shadow:var(--glow);overflow:hidden;transition:background .3s}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--acc);opacity:.9;pointer-events:none}
.panel::before{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:10px}
.panel::after{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:10px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;font-size:.82rem;font-weight:600;letter-spacing:.05em;border-bottom:1px solid var(--line);background:var(--hd)}
.ph .ico{color:var(--acc);margin-right:6px}
.pb{padding:12px 14px}
.hero{text-align:center}
.gauge{width:100%;max-width:260px;display:block;margin:0 auto;filter:drop-shadow(0 0 8px rgba(56,189,248,.35))}
.needle{transform-origin:110px 110px;transition:transform 1.1s cubic-bezier(.34,1.4,.5,1)}
.aqiV{font-family:Orbitron,sans-serif;font-size:2.8rem;font-weight:800;line-height:1;margin-top:-6px;text-shadow:0 0 18px currentColor}
.aqiT{font-size:1rem;font-weight:600;margin-top:6px}
.advice{font-size:.82rem;color:var(--mut);margin-top:2px}
.legend{margin-top:12px}
.bar{height:8px;border-radius:6px;background:linear-gradient(90deg,#22c55e 0 25%,#eab308 25% 50%,#f97316 50% 75%,#ef4444 75%);position:relative}
.bar i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--tx);box-shadow:0 0 8px var(--tx);left:0;transition:left 1.1s ease}
.lbls{display:flex;justify-content:space-between;font-size:.62rem;color:var(--mut);margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{padding:10px 12px;border:1px solid var(--line);border-top:2px solid var(--cc);border-radius:8px;background:linear-gradient(180deg,var(--cg),transparent)}
.card .n{display:flex;align-items:center;gap:6px;font-size:.75rem}
.card .n span{color:var(--mut)}
.card .v{font-family:Orbitron,sans-serif;font-size:1.35rem;font-weight:600;margin-top:4px;text-shadow:0 0 10px var(--cc)}
.card .u{font-size:.72rem;color:var(--mut)}
.card.flash{animation:flash .7s}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--cc)}100%{box-shadow:0 0 0 10px transparent}}
.center{display:flex;flex-direction:column}
#map{flex:1;min-height:560px;background:#0a1226}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--tip);color:var(--tx);border:1px solid var(--line)}
.pulse{width:16px;height:16px;margin:4px;border-radius:50%;background:var(--mc,#22c55e);box-shadow:0 0 14px var(--mc,#22c55e);position:relative}
.pulse::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--mc,#22c55e);animation:ring 2s infinite}
@keyframes ring{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.8);opacity:0}}
.seg{display:flex;gap:6px;justify-content:flex-end}
.cv{position:relative;height:150px}
footer{text-align:center;color:var(--mut);font-size:.75rem;margin-top:14px;letter-spacing:.04em}
@media(max-width:1100px){.layout{grid-template-columns:1fr}#map{min-height:380px}.top{grid-template-columns:1fr}.ttl{order:2}.tr{justify-content:flex-start}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><svg class="ico" viewBox="0 0 24 24"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>SMART AIR</div>
  <div class="ttl" data-i18n="dash"></div>
  <div class="tr">
    <div class="st"><span id="dot" class="dot"></span><span id="status"></span></div>
    <button class="btn" id="langBtn"></button><button class="btn" id="themeBtn"></button>
    <div class="clock" id="clock"></div>
  </div>
</header>

<main class="layout">
  <aside class="col">
    <section class="panel"><div class="ph"><span data-i18n="aqiTitle"></span></div>
      <div class="pb hero">
        <svg class="gauge" viewBox="0 0 220 125" id="gauge"><g id="arcs"></g><g class="needle" id="needle"><line x1="110" y1="110" x2="110" y2="34" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="110" cy="110" r="8" fill="currentColor"/></g></svg>
        <div class="aqiV" id="aqiV">--</div><div class="aqiT" id="aqiT"></div><div class="advice" id="advice"></div>
        <div class="legend"><div class="bar"><i id="pin"></i></div>
          <div class="lbls"><span data-i18n="lb0"></span><span data-i18n="lb1"></span><span data-i18n="lb2"></span><span data-i18n="lb3"></span><span>200+</span></div></div>
      </div></section>
    <section class="panel"><div class="ph"><span data-i18n="sens"></span></div><div class="pb"><div class="grid" id="cards"></div></div></section>
  </aside>

  <section class="panel center">
    <div class="ph"><span><svg class="ico" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span data-i18n="mapTitle"></span></span><span class="st"><span data-i18n="upd"></span>: <span id="upd" class="orb">-</span></span></div>
    <div id="map"></div>
  </section>

  <aside class="col">
    <div class="seg" id="seg"><button class="btn on" data-n="30"></button><button class="btn" data-n="60"></button><button class="btn" data-n="100"></button></div>
    <section class="panel"><div class="ph" data-i18n="g1"></div><div class="pb"><div class="cv"><canvas id="c1"></canvas></div></div></section>
    <section class="panel"><div class="ph" data-i18n="g2"></div><div class="pb"><div class="cv"><canvas id="c2"></canvas></div></div></section>
    <section class="panel"><div class="ph" data-i18n="g3"></div><div class="pb"><div class="cv"><canvas id="c3"></canvas></div></div></section>
    <section class="panel"><div class="ph" data-i18n="g4"></div><div class="pb"><div class="cv"><canvas id="c4"></canvas></div></div></section>
  </aside>
</main>
<footer data-i18n="foot"></footer>
</div>

<script>
const DB_URL="https://iot-131-default-rtdb.asia-southeast1.firebasedatabase.app";
const SENSOR_POS=[7.8804,98.3923]; // แก้เป็นพิกัดจริงของเซ็นเซอร์
firebase.initializeApp({databaseURL:DB_URL});
const db=firebase.database();

// ---------- ภาษา / Language ----------
const I18N={
 th:{dash:"ระบบเฝ้าระวังคุณภาพอากาศ",sens:"ค่าเซ็นเซอร์",aqiTitle:"ดัชนีคุณภาพอากาศ (AQI)",wait:"รอข้อมูล",mapTitle:"ตำแหน่งของเซ็นเซอร์",histTitle:"กราฟย้อนหลัง",pts:"จุด",
  conn:"กำลังเชื่อมต่อ...",on:"เชื่อมต่อ Firebase แล้ว",off:"ขาดการเชื่อมต่อ",upd:"อัปเดตล่าสุด",
  g1:"PM2.5 / PM10 (µg/m³)",g2:"อุณหภูมิ (°C) / ความชื้น (%)",g3:"CO₂ (ppm)",g4:"AQI",
  foot:"ESP32 + ESPHome → Firebase RTDB → GitHub Pages · ข้อมูลจำลองด้วยการสุ่มค่า",
  light:"สว่าง",dark:"มืด",lang:"English",lb0:"0 ดีมาก",lb1:"50 ปานกลาง",lb2:"100 เริ่มมีผล",lb3:"150 มีผล",
  f_temperature:"อุณหภูมิ",f_humidity:"ความชื้น",f_pm25:"PM2.5",f_pm10:"PM10",f_co2:"CO₂",f_aqi:"AQI",
  l1:"ดีมาก",l2:"ปานกลาง",l3:"เริ่มมีผลกระทบต่อสุขภาพ",l4:"มีผลกระทบต่อสุขภาพ",
  a1:"อากาศดี ทำกิจกรรมได้ตามปกติ",a2:"ผู้ที่ไวต่อมลพิษควรระวัง",a3:"ลดกิจกรรมกลางแจ้ง ควรสวมหน้ากาก",a4:"งดกิจกรรมกลางแจ้ง ปิดหน้าต่าง/เปิดเครื่องฟอกอากาศ"},
 en:{dash:"AIR QUALITY MONITORING",sens:"Sensors",aqiTitle:"Air Quality Index (AQI)",wait:"Waiting for data",mapTitle:"Sensor Location",histTitle:"History",pts:"pts",
  conn:"Connecting...",on:"Connected to Firebase",off:"Disconnected",upd:"Last update",
  g1:"PM2.5 / PM10 (µg/m³)",g2:"Temperature (°C) / Humidity (%)",g3:"CO₂ (ppm)",g4:"AQI",
  foot:"ESP32 + ESPHome → Firebase RTDB → GitHub Pages · Simulated random data",
  light:"Light",dark:"Dark",lang:"ภาษาไทย",lb0:"0 Good",lb1:"50 Moderate",lb2:"100 Sensitive",lb3:"150 Unhealthy",
  f_temperature:"Temperature",f_humidity:"Humidity",f_pm25:"PM2.5",f_pm10:"PM10",f_co2:"CO₂",f_aqi:"AQI",
  l1:"Good",l2:"Moderate",l3:"Unhealthy for sensitive groups",l4:"Unhealthy",
  a1:"Air is clean. Enjoy normal activities.",a2:"Sensitive people should take care.",a3:"Reduce outdoor activity and wear a mask.",a4:"Avoid outdoors. Close windows / use an air purifier."}
};
let lang="th",theme="dark",online=null,lastData=null;
try{lang=localStorage.getItem("lang")||"th";theme=localStorage.getItem("theme")||"dark"}catch(e){}
const t=k=>I18N[lang][k];
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmtTime=ts=>(!ts||ts<1e9)?"-":new Date(ts*1000).toLocaleTimeString(lang==="th"?"th-TH":"en-GB");

const FIELDS=[
 {k:"temperature",u:"°C",d:1,c:"#f97316"},{k:"humidity",u:"%",d:1,c:"#38bdf8"},
 {k:"pm25",u:"µg/m³",d:1,c:"#ef4444"},{k:"pm10",u:"µg/m³",d:1,c:"#a855f7"},
 {k:"co2",u:"ppm",d:0,c:"#eab308"},{k:"aqi",u:"",d:0,c:"#22c55e"}];
const F=Object.fromEntries(FIELDS.map(f=>[f.k,f]));
function aqiInfo(v){const i=v<=50?1:v<=100?2:v<=150?3:4;return{t:t("l"+i),a:t("a"+i),c:["","#22c55e","#eab308","#f97316","#ef4444"][i]}}

// ---------- ไอคอน ----------
const svg=p=>`<svg class="ico" viewBox="0 0 24 24">${p}</svg>`;
const ICONS={
 temperature:svg('<path d="M14 4v10.5a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>'),
 humidity:svg('<path d="M12 2.7s6 6.3 6 10.8a6 6 0 0 1-12 0C6 9 12 2.7 12 2.7Z"/>'),
 pm25:svg('<path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>'),
 pm10:svg('<circle cx="7" cy="8" r="1.5"/><circle cx="14" cy="6" r="1"/><circle cx="17" cy="12" r="2"/><circle cx="9" cy="15" r="2"/><circle cx="15" cy="18" r="1"/><circle cx="4" cy="14" r="1"/>'),
 co2:svg('<path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4 4 0 0 1 0 8Z"/>'),
 aqi:svg('<path d="m12 14 4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/>'),
 sun:svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
 moon:svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>'),
 globe:svg('<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20Z"/>')};

// ---------- เกจ ----------
(function(){const cols=["#22c55e","#eab308","#f97316","#ef4444"],R=90,C=110,pt=a=>[C-R*Math.cos(a*Math.PI/180),C-R*Math.sin(a*Math.PI/180)];let h="";
 for(let i=0;i<4;i++){const[a,b]=pt(i*45+2),[c,d]=pt((i+1)*45-2);h+=`<path d="M${a} ${b} A${R} ${R} 0 0 1 ${c} ${d}" fill="none" stroke="${cols[i]}" stroke-width="16" stroke-linecap="round"/>`}
 document.getElementById("arcs").innerHTML=h})();
function setNeedle(v){const p=Math.max(0,Math.min(v,200))/200;document.getElementById("needle").style.transform=`rotate(${-90+p*180}deg)`;document.getElementById("pin").style.left=`calc(${p*100}% - 2px)`}

// ---------- การ์ด ----------
const cardsEl=document.getElementById("cards");
FIELDS.forEach(f=>cardsEl.insertAdjacentHTML("beforeend",`<div class="card" id="card-${f.k}" style="--cc:${f.c};--cg:${f.c}1f"><div class="n" style="color:${f.c}">${ICONS[f.k]}<span id="n-${f.k}"></span></div><div class="v" id="v-${f.k}">--</div><div class="u">${f.u}</div></div>`));
function setNum(el,to,d){const from=parseFloat(el.dataset.v)||0;el.dataset.v=to;const t0=performance.now();
 (function s(n){const p=Math.min((n-t0)/700,1),e=1-Math.pow(1-p,3);el.textContent=(from+(to-from)*e).toFixed(d);if(p<1)requestAnimationFrame(s)})(t0)}
function flash(k){const c=document.getElementById("card-"+k);c.classList.remove("flash");void c.offsetWidth;c.classList.add("flash")}

// ---------- กราฟ (สไตล์ใหม่) ----------
const hexA=(h,a)=>h+Math.round(a*255).toString(16).padStart(2,"0");
const bands={id:"bands",beforeDatasetsDraw(ch){const y=ch.scales.y,a=ch.chartArea,c=ch.ctx;
 [[0,50,"#22c55e"],[50,100,"#eab308"],[100,150,"#f97316"],[150,200,"#ef4444"]].forEach(([lo,hi,col])=>{c.fillStyle=col+"22";const y1=y.getPixelForValue(hi);c.fillRect(a.left,y1,a.right-a.left,y.getPixelForValue(lo)-y1)})}};
function mkChart(id,keys,extra={}){
 const ds=keys.map(k=>{const col=F[k].c;return{key:k,unit:F[k].u,label:"",data:[],borderColor:col,borderWidth:2.5,tension:.4,fill:true,
  backgroundColor:cx=>{const a=cx.chart.chartArea;if(!a)return hexA(col,.2);const g=cx.chart.ctx.createLinearGradient(0,a.top,0,a.bottom);g.addColorStop(0,hexA(col,.35));g.addColorStop(1,hexA(col,0));return g},
  pointRadius:cx=>cx.dataIndex===cx.dataset.data.length-1?4.5:0,pointHoverRadius:6,pointBackgroundColor:col,pointBorderColor:"#fff",pointBorderWidth:2}});
 const ch=new Chart(document.getElementById(id),{type:"line",data:{labels:[],datasets:ds},plugins:extra.plugins||[],
  options:{responsive:true,maintainAspectRatio:false,animation:{duration:600},interaction:{mode:"index",intersect:false},
   plugins:{legend:{align:"end",labels:{usePointStyle:true,pointStyle:"circle",boxWidth:8,boxHeight:8}},
    tooltip:{padding:10,cornerRadius:10,borderWidth:1,usePointStyle:true,callbacks:{label:c=>` ${c.dataset.label}: ${c.parsed.y.toFixed(F[c.dataset.key].d)} ${c.dataset.unit}`}}},
   scales:{x:{ticks:{maxTicksLimit:5,maxRotation:0},grid:{display:false},border:{display:false}},
    y:{ticks:{maxTicksLimit:5},grid:{},border:{display:false},min:extra.min,max:extra.max}}}});
 return{ch,keys}}
function themeChart(ch){const o=ch.options,m=css("--mut");
 o.scales.x.ticks.color=m;o.scales.y.ticks.color=m;o.scales.y.grid.color=css("--line");o.plugins.legend.labels.color=css("--tx");
 const tp=o.plugins.tooltip;tp.backgroundColor=css("--tip");tp.borderColor=css("--line");tp.titleColor=css("--tx");tp.bodyColor=css("--tx");ch.update("none")}
const charts=[mkChart("c1",["pm25","pm10"]),mkChart("c2",["temperature","humidity"]),mkChart("c3",["co2"]),mkChart("c4",["aqi"],{plugins:[bands],min:0,max:200})];

// ---------- แผนที่ ----------
const map=L.map("map").setView(SENSOR_POS,14);
const TILES={dark:L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap &copy; CARTO"}),
 light:L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"})};
let curTile=null;
function setTiles(){const n=TILES[theme];if(curTile===n)return;if(curTile)map.removeLayer(curTile);n.addTo(map);curTile=n}
const marker=L.marker(SENSOR_POS,{icon:L.divIcon({className:"",html:'<div class="pulse"></div>',iconSize:[24,24]})}).addTo(map);
marker.bindPopup("esp32-air-01");

// ---------- แสดงผล (เรียกซ้ำเมื่อเปลี่ยนภาษา/ธีม) ----------
function renderLatest(){
 const d=lastData,a=d?aqiInfo(d.aqi):null;
 document.getElementById("aqiT").textContent=d?a.t:t("wait");
 document.getElementById("advice").textContent=d?a.a:"";
 if(d){document.getElementById("aqiT").style.color=a.c;
  marker.setPopupContent(`<b>${d.device_id||"esp32-air-01"}</b><br>AQI: ${Math.round(d.aqi)} (${a.t})<br>PM2.5: ${Number(d.pm25).toFixed(1)} µg/m³<br>${t("f_temperature")}: ${Number(d.temperature).toFixed(1)} °C`)}
 else marker.setPopupContent("esp32-air-01<br>"+t("wait"));
 document.getElementById("upd").textContent=d?(fmtTime(d.timestamp)!=="-"?fmtTime(d.timestamp):new Date().toLocaleTimeString()):"-"}
function renderAll(){
 document.documentElement.lang=lang;document.documentElement.dataset.theme=theme;
 document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
 FIELDS.forEach(f=>document.getElementById("n-"+f.k).textContent=t("f_"+f.k));
 document.querySelectorAll("#seg .btn").forEach(b=>b.textContent=`${b.dataset.n} ${t("pts")}`);
 document.getElementById("status").textContent=online===null?t("conn"):online?t("on"):t("off");
 document.getElementById("langBtn").innerHTML=ICONS.globe+" "+t("lang");
 document.getElementById("themeBtn").innerHTML=theme==="dark"?ICONS.sun+" "+t("light"):ICONS.moon+" "+t("dark");
 document.getElementById("gauge").style.color=css("--tx");setTiles();
 charts.forEach(o=>{o.ch.data.datasets.forEach(s=>s.label=t("f_"+s.key));themeChart(o.ch)});
 renderLatest()}
document.getElementById("langBtn").onclick=()=>{lang=lang==="th"?"en":"th";try{localStorage.setItem("lang",lang)}catch(e){}renderAll()};
document.getElementById("themeBtn").onclick=()=>{theme=theme==="dark"?"light":"dark";try{localStorage.setItem("theme",theme)}catch(e){}renderAll()};

// ---------- Realtime: latest ----------
db.ref("latest").on("value",snap=>{
 const d=snap.val();if(!d)return;lastData=d;
 if(typeof d.lat==="number"&&typeof d.lng==="number")marker.setLatLng([d.lat,d.lng]);
 document.documentElement.style.setProperty("--mc",aqiInfo(d.aqi).c);
 FIELDS.forEach(f=>{if(typeof d[f.k]==="number"){setNum(document.getElementById("v-"+f.k),d[f.k],f.d);flash(f.k)}});
 const v=document.getElementById("aqiV");setNum(v,d.aqi,0);v.style.color=aqiInfo(d.aqi).c;
 setNeedle(d.aqi);renderLatest()});

// ---------- Realtime: history ----------
let histRef=null;
function subscribeHistory(n){
 if(histRef)histRef.off();
 histRef=db.ref("history").limitToLast(n);
 histRef.on("value",snap=>{const rows=[];snap.forEach(c=>{rows.push(c.val())});
  const labels=rows.map(r=>fmtTime(r.timestamp));
  charts.forEach(o=>{o.ch.data.labels=labels;o.ch.data.datasets.forEach(s=>s.data=rows.map(r=>r[s.key]));o.ch.update()})})}
document.querySelectorAll("#seg .btn").forEach(b=>b.onclick=()=>{document.querySelectorAll("#seg .btn").forEach(x=>x.classList.remove("on"));b.classList.add("on");subscribeHistory(+b.dataset.n)});
db.ref(".info/connected").on("value",s=>{online=s.val()===true;document.getElementById("dot").className="dot"+(online?" on":"");document.getElementById("status").textContent=online?t("on"):t("off")});

const pad=n=>String(n).padStart(2,"0");
function tick(){const d=new Date();document.getElementById("clock").textContent=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
setInterval(tick,1000);tick();
setNeedle(0);renderAll();subscribeHistory(30);setTimeout(()=>map.invalidateSize(),400);
</script>
</body>
</html>
